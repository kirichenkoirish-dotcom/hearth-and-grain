<!-- Письмо для входа на сайт. {{ .RedirectTo }} — адрес сайта, с которого попросили ссылку
     (localhost или vercel.app), {{ .TokenHash }} — одноразовый ключ, {{ .Token }} — 6-значный код. -->
<div style="background:#e4d9ce;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#251810">
  <div style="max-width:480px;margin:0 auto;background:#efe7df;border-radius:12px;padding:32px">
    <p style="margin:0 0 4px;color:#d45f00;font-size:13px;letter-spacing:1px;text-transform:uppercase">Hearth &amp; Grain</p>
    <h1 style="margin:0 0 16px;font-size:26px;font-weight:600">Sign in to your account</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Tap the button to sign in. The link works once and expires in an hour.</p>
    <p style="margin:0 0 28px">
      <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#522a17;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:16px">
        Sign in
      </a>
    </p>
    <p style="margin:0 0 8px;font-size:15px">Or enter this code on the site:</p>
    <p style="margin:0 0 24px;font-size:32px;letter-spacing:8px;font-weight:700">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;color:#6b5a50">If you didn’t ask to sign in, just ignore this email.</p>
  </div>
</div>
